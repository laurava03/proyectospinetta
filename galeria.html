<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Index</title>
	<link rel="stylesheet" type="text/css" href="estilos.css">
	<style>
		main div{
			display: flex;
			flex-wrap: wrap;
			align-items: center;
		}
		main div figure{
			flex: 1;
			min-width: 200px;
		}
		main div img{
			border-radius: 50%;
		}
		h2, figcaption{
			text-align: center;
		}
		
	</style>
</head>
<body>
	<header>
		<h1>Todo sobre "el Flaco"</h1>
		
	</header>
	<nav>
		<ul>
			<li><a href="index.html">Inicio</a></li>
			<li><a href="noticias.html">Noticias</a></li>
			<li><a href="galeria.html">Galería</a></li>
			<li><a href="contacto.html">Contacta</a></li>
			<li><a href="registro.html">Registro</a></li>
		</ul>
	</nav>
	
	<main>
		<h2>Galería de imágenes</h2>
		<div>
			<figure>
				<img src="img/foto1.jpg" alt="grupo" />
				<figcaption>El flaco y su banda</figcaption>
			</figure>
			<figure>
				<img src="img/foto2.jpg" alt="portada" />
				<figcaption>Portada de Guitarra Negra</figcaption>
			</figure>
			<figure>
				<img src="img/foto3.jpg" alt="concierto" />
				<figcaption>Concierto en vivo</figcaption>
			</figure>
			<figure>
				<img src="img/foto4.jpg" alt="embarazo" />
				<figcaption>El flaco y su mujer</figcaption>
			</figure>
			<figure>
				<img src="img/foto5.jpg" alt="flaco" />
				<figcaption>El flaco</figcaption>
			</figure>
			<figure>
				<img src="img/foto6.jpg" alt="cantante" />
				<figcaption>Concierto en vivo solista</figcaption>
			</figure>
			<figure>
				<img src="img/foto7.jpg" alt="banda" />
				<figcaption>Concierto en vivo</figcaption>
			</figure>
			<figure>
				<img src="img/foto8.jpg" alt="joven" />
				<figcaption>El flaco</figcaption>
			</figure>

		</div>

	</main>
	<footer>
		<ul>
			<li><a href="#">Quiénes somos</a></li>
			<li><a href="#">Privacidad</a></li>
		</ul>
	</footer>	
		
	<form>
		<fieldset>
				<label>Usuario:</label>
				<input type="text" autofocus required maxlength="8" pattern="^[a-zA-Z]\w{2,7}$" title="El usuario debe contener entre 3 y 8 caracteres" />
			</fieldset>
			<fieldset>
				<label>Contraseña:</label>
				<input type="password" name="pass" min="6"/>
			</fieldset>
			<button type="submit">Login</button>
	</form>	
	
</body>
</html>
