<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Index</title>
	<link rel="stylesheet" type="text/css" href="estilos.css">
	<style>
		main{
			background-image: url(img/flaco.jpg);
			opacity: 0.8;
		}
		main form{
			width: 65%;
			margin: 10% 15%;
			padding: 5%;
			font-family: verdana;
		}
		main form input:nth-of-type(7){
			display: inline-block;
			width: 1px;
		}
		main form fieldset input:nth-of-type(8){
			display: inline-block;
			width: 1px;
		}
		main form fieldset input:nth-of-type(9){
			display: inline-block;
			width: 1px;
		}
		main form label{
			display: inline-block;
			min-width: 100px;
			margin: 1.5%;
		}
		legend{
			font-size: 2vw;
			font-weight: bold;
		}
		main div{
			text-align: center;
			margin: 8%;
			display: inline-flex;
		}
		main div button{
			background-color: #E773BF;
			padding: 1.6%;
			margin: 2%;
			padding: 1%;
			width: 100px;
		}
	</style>
</head>
<body>
	<header>
		<h1>Todo sobre "el Flaco"</h1>
		
	</header>
	<nav>
		<ul>
			<li><a href="index.html">Inicio</a></li>
			<li><a href="noticias.html">Noticias</a></li>
			<li><a href="galeria.html">Galería</a></li>
			<li><a href="contacto.html">Contacta</a></li>
			<li><a href="registro.html">Registro</a></li>
		</ul>
	</nav>
	
	<main>
		<form>
				<h2>Formulario de Registro</h2>

				<label>Nombre:</label>
				<input type="text" name="nombre" autofocus required/><br>
				<label>Apellido:</label>
				<input type="text" name="apellido" required/><br>
				<label>DNI:</label>
				<input type="text" name="dni" maxlength="9" pattern="^[\dXYZ]\d{7}[A-Z]$" required title="Mínimo 9 caracteres" /><br>
				<label>Usuario:</label>
				<input type="text" autofocus required maxlength="8" pattern="^[a-zA-Z]\w{2,7}$" title="El usuario debe contener entre 3 y 8 caracteres" /><br>
				<label>Contraseña:</label>
				<input type="password" name="pass" pattern="[a-zA-Z]{6,12}" required title="La contraseña debe tener entre 6 y 12 caracteres en minúsculas o mayúsculas" /><br>
				
				<label>Mail:</label>
				<input type="text" name="mail" pattern="\w{1,}@\w{1,}[.]\w{1,3}" required/><br>
				<label>Sexo:</label>
				<input type="radio" name="sexo" value="H" required /><label>Hombre</label>
				<input type="radio" name="sexo" value="M"/><label>Mujer</label>
				<input type="radio" name="sexo" value="N"/><label>No binario</label><br>

				<label>Fecha de nacimiento:</label>
				<input type="date" name="fecha" required/><br>
				
				<input type="checkbox" name="agree" value="1" required/>
				<label>Acepto los términos y condiciones de uso</label>
				<hr>
				<legend>Preferencias musicales</legend>

				<input type="checkbox" name="nacional" value="ok"/><label>Rock nacional</label>
				<input type="checkbox" name="heavy" value="ok"/><label>Heavy metal</label>
				<input type="checkbox" name="indi" value="ok"/><label>Indi-pop</label>
				<input type="checkbox" name="electro" value="ok"/><label>Electrónica</label>
				<input type="checkbox" name="folk" value="ok"/><label>Folclore</label>
			<hr>

			<div>
				<button type="submit">Enviar</button>
				<button type="reset">Borrar</button>
			</div>
		</form>
	</main>
	<footer>
		<ul>
			<li><a href="#">Quiénes somos</a></li>
			<li><a href="#">Privacidad</a></li>
		</ul>
	</footer>	
		
	<form>
		<fieldset>
				<label>Usuario:</label>
				<input type="text" autofocus required maxlength="8" pattern="^[a-zA-Z]\w{2,7}$" title="El usuario debe contener entre 3 y 8 caracteres" />
			</fieldset>
			<fieldset>
				<label>Contraseña:</label>
				<input type="password" name="pass" min="6"/>
			</fieldset>
			<button type="submit">Login</button>
	</form>	
	
</body>
</html>
