<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Index</title>
	<link rel="stylesheet" type="text/css" href="estilos.css">
	<style>
		main iframe{
			width: 100%;
			height: 400px;
		}
		main h2, main p{
			margin: 2%;
		}
		main form{
			border: none;
			text-align: left;
			font-family: verdana;
			background-image: none;
		}
		main form label{
			display: inline-block;
			min-width: 200px;	
			text-align: left;	
			margin: 1% 2%;
		}
		main form input{
			width: 210px;
		}
		main textarea{
			border: 1px solid #07199C;
			font-family: tahoma;
			margin: 1% 2%;
			width: 90%;
		}
		main div{
			text-align: center;
			margin: 8%;
			display: inline-flex;
		}
		main div button{
			background-color: #E773BF;
			padding: 1.6%;
			margin: 2%;
			padding: 1%;
			width: 100px;
		}

	</style>
</head>
<body>
	<header>
		<h1>Todo sobre "el Flaco"</h1>
		
	</header>
	<nav>
		<ul>
			<li><a href="index.html">Inicio</a></li>
			<li><a href="noticias.html">Noticias</a></li>
			<li><a href="galeria.html">Galería</a></li>
			<li><a href="contacto.html">Contacta</a></li>
			<li><a href="registro.html">Registro</a></li>
		</ul>
	</nav>
	
	<main>
		
		<h2>Contacta con nosotros</h2>
		<form>
			<label >Nombre:</label>
				<input type="text" name="usuario" autofocus required /><br>
				<label>Mail:</label>
				<input type="text" name="mail" pattern="\w{1,}@\w{1,}[.]\w{1,3}" required/><br>
				
				<label>Motivo de la consulta:</label>
				<select name="motivo" ><br>
					<option value="1">Cómo puedo aportar como fan</option>
					<option value="2">Cada cuánto se juntan</option>
					<option value="3">Cada cuánto publican eventos</option>
					<option value="4">Cuánto cuesta ser socio</option>
				</select><br>

				<textarea name="comentarios" cols="100" rows="5">Indica aquí tu consulta...</textarea><br>

			<div>
				<button type="submit">Enviar</button>
				<button type="reset">Borrar</button>
			</div>
		</form>

		<h2>Dónde estamos</h2>
		<p>Carrer Dr. Santponç, 60, 66, Sant Andreu</p>
		<p>08030 Barcelona</p>
		<p>Tel. 932 452 922</p> 
		<p>aspasia@santandreu.cat</p>

		<iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d5987.425147405985!2d2.17015385!3d41.38032905!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x12a4a258a559a755%3A0x1c00fae37a474ef0!2s08001%20Barcelona!5e0!3m2!1ses!2ses!4v1784742005331!5m2!1ses!2ses" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

	</main>
	<footer>
		<ul>
			<li><a href="#">Quiénes somos</a></li>
			<li><a href="#">Privacidad</a></li>
		</ul>
	</footer>	
		
	<form>
		<fieldset>
				<label>Usuario:</label>
				<input type="text" autofocus required maxlength="8" pattern="^[a-zA-Z]\w{2,7}$" title="El usuario debe contener entre 3 y 8 caracteres" />
			</fieldset>
			<fieldset>
				<label>Contraseña:</label>
				<input type="password" name="pass" min="6"/>
			</fieldset>
			<button type="submit">Login</button>
	</form>	
	
</body>
</html>
